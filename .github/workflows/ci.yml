name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify module graph
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Verify handler dependency boundary
        run: |
          test -z "$(go list -deps -f '{{if and (not .Standard) (ne .ImportPath "github.com/jasonjiang8866/smbfileserver/smbhttp")}}{{.ImportPath}}{{end}}' ./smbhttp)"
      - name: Verify access policy dependency boundary
        run: |
          test -z "$(go list -deps -f '{{if and (not .Standard) (ne .ImportPath "github.com/jasonjiang8866/smbfileserver/access")}}{{.ImportPath}}{{end}}' ./access)"
      - name: Verify client has no gateway dependencies
        run: |
          go list -deps -f '{{.ImportPath}}' ./client > /tmp/client-dependencies
          if grep -Eq '^(github.com/gofiber/|github.com/joho/godotenv|github.com/jasonjiang8866/smbfileserver/smbhttp)' /tmp/client-dependencies; then
            cat /tmp/client-dependencies
            exit 1
          fi
      - run: go vet -tags=integration ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o /tmp/smbfileserver .
      - name: Check reachable vulnerabilities
        if: matrix.go == '1.27.x'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  samba:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Install Samba fixture tools
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends samba
      - name: Render Kubernetes and OpenShift manifests
        run: |
          go run sigs.k8s.io/kustomize/kustomize/v5@v5.8.0 build deploy/base > /tmp/kubernetes.yaml
          go run sigs.k8s.io/kustomize/kustomize/v5@v5.8.0 build deploy/openshift > /tmp/openshift.yaml
          go run sigs.k8s.io/kustomize/kustomize/v5@v5.8.0 build deploy/openshift-monitoring > /tmp/openshift-monitoring.yaml
      - name: Validate acceptance script without a cluster
        run: python3 -m unittest discover -s scripts -p 'test_accept*.py'
      - name: Build gateway image
        run: docker build -t smbfileserver:ci .
      - name: Verify real SMB reads and restricted container runtime
        env:
          SMB_CONTAINER_TEST_IMAGE: smbfileserver:ci
        run: python3 scripts/test-samba.py
