apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../openshift
  - service.yaml
  - servicemonitor.yaml
  - networkpolicy.yaml
patches:
  - target:
      kind: ConfigMap
      name: smbfileserver
    patch: |-
      - op: add
        path: /data/METRICS_ADDR
        value: ':9090'
  - target:
      kind: Deployment
      name: smbfileserver
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: metrics
          containerPort: 9090
